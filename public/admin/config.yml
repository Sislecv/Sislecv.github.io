# Decap CMS 配置
# 字段定义与 src/content.config.ts 的 posts schema 一一对应

backend:
  name: github
  repo: Sislecv/sislecv.github.io
  branch: main
  base_url: https://decap-proxy.sislecv2.workers.dev
  auth_endpoint: /auth

# 站点地址（用于预览链接与显示）
site_url: https://whoami.nx.kg
display_url: https://whoami.nx.kg
locale: zh_Hans

# 图片上传位置：仓库 public/images/，页面引用 /images/...
media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    sortable_fields: [published, title]
    view_filters:
      - label: 已发布
        field: draft
        pattern: false
      - label: 草稿
        field: draft
        pattern: true
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: published, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: 更新日期, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false }
      - { label: 描述, name: description, widget: text, required: false }
      - { label: 封面图 (支持本地上传与外链), name: image, widget: image, choose_url: true, required: false }
      - { label: 标签, name: tags, widget: list, required: false, default: [] }
      - { label: 分类, name: category, widget: string, required: false }
      - { label: 语言, name: lang, widget: string, required: false }
      - { label: 正文, name: body, widget: markdown }

  - name: talks
    label: 说说
    label_singular: 说说
    folder: src/content/talks
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [published]
    fields:
      - { label: 时间, name: published, widget: datetime, date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 内容, name: body, widget: markdown }

  - name: gallery
    label: 图集
    label_singular: 图片
    folder: src/content/gallery
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{order}}"
    sortable_fields: [order]
    fields:
      - { label: 图片 (支持本地上传与外链), name: src, widget: image, choose_url: true, required: true }
      - { label: 描述, name: alt, widget: string, required: false }
      - { label: 排序, name: order, widget: number, value_type: int, default: 1, required: false }
      - { label: 首页堆叠展示, name: featured, widget: boolean, default: false, required: false }

  - name: settings
    label: 站点配置
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: 基础信息与个人资料
        file: src/data/site.json
        format: json
        fields:
          - { label: 站点标题, name: title, widget: string }
          - { label: 一句话简介, name: description, widget: string }
          - { label: 部署地址, name: url, widget: string }
          - { label: 作者名, name: author, widget: string }
          - { label: 头像 (支持本地上传与外链), name: avatar, widget: image, choose_url: true, required: false }
          - { label: 默认主题色, name: defaultColor, widget: string, default: "#0b57d0" }

      - name: social
        label: 社交链接
        file: src/data/social.json
        format: json
        fields:
          - label: 社交链接列表
            name: links
            widget: list
            summary: "{{fields.label}} - {{fields.url}}"
            fields:
              - { label: 平台名称, name: label, widget: string }
              - { label: 链接地址, name: url, widget: string }

      - name: techstack
        label: 技术栈卡片
        file: src/data/techstack.json
        format: json
        fields:
          - label: 技术栈列表
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 技术名称, name: name, widget: string }
              - { label: 图标 (支持本地上传与外链), name: icon, widget: image, choose_url: true }
              - { label: 官网链接, name: url, widget: string }

      - name: projects
        label: GitHub 项目便签
        file: src/data/projects.json
        format: json
        fields:
          - label: 项目列表
            name: items
            widget: list
            summary: "{{fields.name}} ({{fields.lang}})"
            fields:
              - { label: 项目名称, name: name, widget: string }
              - { label: 项目简介, name: description, widget: string }
              - { label: 仓库链接, name: url, widget: string }
              - { label: 主语言, name: lang, widget: string }
              - { label: Star 数, name: stars, widget: number, value_type: int, default: 0 }
              - { label: 自定义底色, name: color, widget: string, required: false }

